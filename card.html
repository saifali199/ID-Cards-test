<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>محفظة الحساب · العالمي للحسابات</title>
<style>
  :root{
    --ink:#1d1d1f; --ink2:#424245; --mute:#6e6e73; --line:#d2d2d7; --soft:#f5f5f7;
    --blue:#0071e3; --blue-h:#0077ed; --link:#0066cc; --ok:#1d8a3a;
    --brand1:#e8453c; --brand2:#ff8a3d; --brand3:#d6336c; --brand4:#8e44ef; --brand5:#2d7ff9;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","Segoe UI","Noto Kufi Arabic",Tahoma,sans-serif;
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","Segoe UI","Noto Kufi Arabic",Tahoma,sans-serif;
    --ease:cubic-bezier(.25,.1,.25,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);font:17px/1.47 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* ===== شريط علوي ===== */
  .gnav{position:sticky;top:0;z-index:10;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
        background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        font-size:13px;font-weight:600;color:var(--ink);padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top))}
  .gnav svg{width:18px;height:18px}
  .lnav{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}
  .lnav .in{max-width:980px;margin:auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
  .lnav b{font:600 21px/1 var(--display);letter-spacing:.01em}
  .lnav span{font-size:12px;color:var(--mute);direction:ltr}

  main{max-width:692px;margin:auto;padding:0 20px 40px}
  .view{animation:in .5s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view,.ring{animation:none!important}}

  /* ===== البداية ===== */
  .hero{text-align:center;padding:44px 0 8px}
  .ring{width:200px;height:200px;margin:0 auto 26px;display:block;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ringwrap{position:relative;width:200px;margin:auto}
  .ringwrap .mark{position:absolute;inset:0 0 26px;display:grid;place-items:center;pointer-events:none}
  .ringwrap .mark svg{width:58px;height:58px}
  h1{font:700 40px/1.1 var(--display);letter-spacing:-.015em;margin:0 0 14px}
  .lead{font-size:19px;line-height:1.42;color:var(--ink2);margin:0 auto 30px;max-width:520px}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:44px;padding:0 22px;border-radius:980px;
        background:var(--blue);color:#fff;font-size:17px;font-weight:400;transition:background .2s}
  .pill:hover{background:var(--blue-h)} .pill:disabled{background:#e8e8ed;color:#a1a1a6;cursor:default}
  .pill.wide{width:100%;height:50px;border-radius:12px;font-size:17px}
  .link{color:var(--link);font-size:17px;padding:10px 4px}
  .link:hover{text-decoration:underline}

  /* ===== مربعات الميزات ===== */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:44px 0 0}
  @media (max-width:600px){.tiles{grid-template-columns:1fr;gap:14px}}
  .tile{background:#fff;border-radius:18px;padding:30px 28px;box-shadow:2px 4px 12px rgba(0,0,0,.08)}
  .tile svg{width:34px;height:34px;color:var(--blue);margin-bottom:16px}
  .tile h3{font:600 24px/1.17 var(--display);margin:0 0 8px}
  .tile p{margin:0;color:var(--ink2);font-size:17px}
  .band{background:var(--soft);margin:56px -20px 0;padding:40px 20px 30px}
  .band .in{max-width:652px;margin:auto}

  /* ===== الشروط ===== */
  .h2{font:600 32px/1.125 var(--display);text-align:center;margin:40px 0 8px}
  .sub{text-align:center;color:var(--ink2);margin:0 0 28px}
  .terms{list-style:none;padding:0;margin:0 0 22px;border-radius:18px;background:var(--soft);overflow:hidden}
  .terms li{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid #e8e8ed;font-size:16px;color:var(--ink2)}
  .terms li:last-child{border-bottom:0}
  .terms li i{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font:600 13px var(--font);font-style:normal}
  .agree{display:flex;align-items:center;gap:12px;padding:6px 4px 22px;font-size:16px;cursor:pointer}
  .agree input{appearance:none;width:22px;height:22px;border-radius:6px;border:1.5px solid #86868b;display:grid;place-items:center;margin:0;flex:none;transition:.15s}
  .agree input:checked{background:var(--blue);border-color:var(--blue)}
  .agree input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

  /* ===== الفيديو ===== */
  .player{border-radius:18px;overflow:hidden;background:#000;box-shadow:2px 4px 12px rgba(0,0,0,.08);margin-bottom:24px}
  .player video,.player iframe{display:block;width:100%;max-height:70vh;border:0}
  .player iframe{aspect-ratio:9/16}

  /* ===== نموذج المعلومات (مثل صفحة إنشاء الحساب) ===== */
  .form{max-width:400px;margin:0 auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:8px}
  .fld{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:9px 14px;margin-bottom:10px;
       border:1px solid #86868b;border-radius:12px;background:#fff;text-align:start;transition:border-color .15s, box-shadow .15s}
  .fld:hover{border-color:var(--ink)}
  .fld:active{transform:scale(.995)}
  .fld .t{flex:1;min-width:0}
  .fld small{display:block;font-size:12px;line-height:1.3;color:var(--mute)}
  .fld .v{display:block;font-size:17px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
  /* خانات صغيرة (الاسم، التاريخ): بدون دائرة النسخ حتى يبقى مكان، والخانة كلها تنضغط */
  .fld.sm{padding:9px 12px}
  .fld.sm .cp{display:none}
  .fld.sm.done .cp{display:grid;position:absolute;top:6px;left:6px;width:20px;height:20px}
  .fld.sm.done .cp svg{width:12px;height:12px}
  .fld.sm .v{overflow-wrap:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid3 .fld .v{font-size:16px}
  .fld .v.ltr{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .fld .cp{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:#f0f6ff}
  .fld .cp svg{width:16px;height:16px}
  .fld.done{border-color:var(--ok);box-shadow:0 0 0 3px rgba(29,138,58,.12)}
  .fld.done .cp{background:var(--ok);color:#fff}
  .sep{height:1px;background:#e8e8ed;margin:22px 0}
  .lbl{font-size:17px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .note{font-size:12px;line-height:1.35;color:var(--mute);margin:-2px 2px 0}
  .steps-mini{font-size:12px;color:var(--mute);text-align:center;margin:30px 0 0}

  /* ===== أسفل الصفحة ===== */
  footer{background:var(--soft);color:var(--mute);font-size:12px;line-height:1.33}
  footer .in{max-width:692px;margin:auto;padding:18px 20px calc(22px + env(safe-area-inset-bottom))}
  footer .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  footer a{color:var(--ink2);text-decoration:none} footer a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
         background:rgba(29,29,31,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:980px;transition:.25s var(--ease);pointer-events:none;
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .err{text-align:center;padding:80px 0}
</style>
</head>
<body>
<nav class="gnav" aria-label="المحل"><span id="shopTop"></span></nav>
<div class="lnav"><div class="in"><b>محفظة الحساب</b><span id="serialTop"></span></div></div>
<main id="app"></main>
<footer><div class="in">
  <div id="footHelp"></div>
  <div class="row"><span id="footShop"></span><span>هذه الصفحة خدمة من المحل ولا تتبع شركة Apple.</span></div>
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ====== إعدادات الصفحة (عدّلها مرة وحدة) ====== */
const CONFIG = {
  shopName: "العالمي للحسابات",
  whatsapp: "9647716145089",          // بدون + وبدون مسافات
  videoUrl: "tutorial-nexel.mp4",               // رابط فيديو الشرح (ملف بنفس المجلد أو رابط يوتيوب)
};
/* ============================================== */

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const ICON = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play:'<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="30" height="22" rx="5"/><path d="M15 13.5v9l7.5-4.5z" fill="currentColor"/></svg>',
  match:'<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10h22M7 18h22M7 26h13"/><circle cx="27" cy="26" r="3.5"/></svg>',
  phone:'<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="10" y="3" width="16" height="30" rx="4"/><path d="M16 28h4" stroke-linecap="round"/></svg>',
  shield:'<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M18 4l11 4v9c0 7.5-4.7 12.6-11 15-6.3-2.4-11-7.5-11-15V8z"/><path d="M13 18l3.5 3.5L23.5 14" stroke-linecap="round"/></svg>',
  user:'<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="ug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".5" stop-color="#e8453c"/><stop offset="1" stop-color="#8e44ef"/></linearGradient></defs><circle cx="32" cy="23" r="11" fill="url(#ug)"/><path d="M12 54c2.5-11 10.5-16 20-16s17.5 5 20 16" fill="url(#ug)"/></svg>',
  wa:'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="vertical-align:-2px"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></svg>',
};

/* دائرة النقاط بألوان المحل */
function ring(){
  const cols = ["#ff8a3d","#f86b3a","#e8453c","#e33b5f","#d6336c","#c23a99","#a33fd0","#8e44ef","#6c5cf5","#4a72f8","#2d7ff9","#3aa0e8","#4bb8c9","#8fbf9a","#d0b07a","#f2a05a"];
  let dots = "";
  [[88,40,6.2],[70,32,4.6],[54,26,3.4]].forEach(([r,n,s],k) => {
    for(let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2 + k*0.09, c = cols[Math.floor((i/n)*cols.length)];
      dots += `<circle cx="${(100+r*Math.cos(a)).toFixed(1)}" cy="${(100+r*Math.sin(a)).toFixed(1)}" r="${s}" fill="${c}" opacity="${1-k*.18}"/>`;
    }
  });
  return `<div class="ringwrap"><svg class="ring" viewBox="0 0 200 200" aria-hidden="true">${dots}</svg><div class="mark">${ICON.user}</div></div>`;
}

function decode(h){
  try{
    let b = h.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const txt = new TextDecoder().decode(Uint8Array.from(atob(b), c=>c.charCodeAt(0)));
    const [v,s,e,p,f,l,d,ph] = txt.split("\u001f");
    if(v!=="1" || !e || !p) return null;
    return {s,e,p,f,l,d,ph};
  }catch{ return null; }
}

const acc = decode(location.hash.slice(1));
const agreedKey = "agreed_"+(acc?.s||"");
const isIcloud = acc && /@icloud\.com$/i.test(acc.e);

$("#shopTop").textContent = CONFIG.shopName;
$("#footShop").textContent = "© " + CONFIG.shopName;
if(acc){ $("#serialTop").textContent = acc.s || ""; }
if(CONFIG.whatsapp){
  $("#footHelp").innerHTML = `تحتاج مساعدة؟ <a href="https://wa.me/${esc(CONFIG.whatsapp)}?text=${encodeURIComponent("مساعدة بالحساب رقم "+(acc?.s||""))}">${ICON.wa} راسلنا على واتساب</a>`;
}

function go(fn){ app.innerHTML = `<div class="view">${fn()}</div>`; scrollTo({top:0,behavior:"smooth"}); }

/* 1) الترحيب */
function home(){
  go(() => `
  <section class="hero">
    ${ring()}
    <h1>حسابك جاهز.</h1>
    <p class="lead">كل معلومات حسابك محفوظة هنا بشكل آمن. اتبع الخطوات وأنشئ حسابك على جهازك بدقائق.</p>
    <button class="pill" id="start">ابدأ</button>
  </section>
  <div class="band"><div class="in">
    <div class="tiles" style="margin:0">
      <div class="tile">${ICON.play}<h3>شاهد الشرح.</h3><p>فيديو قصير يوضح لك كل خطوة لإنشاء الحساب على الآيفون.</p></div>
      <div class="tile">${ICON.match}<h3>انسخ والصق.</h3><p>كل معلومة إلها زر نسخ، حتى تكتبها بالضبط بدون أي غلط.</p></div>
      <div class="tile">${ICON.phone}<h3>اربط رقمك.</h3><p>رقم هاتفك يحمي حسابك ويخليك ترجعه إذا نسيت الباسورد.</p></div>
      <div class="tile">${ICON.shield}<h3>خاص وآمن.</h3><p>معلوماتك ما تنحفظ على أي سيرفر، موجودة بس داخل الباركود مالتك.</p></div>
    </div>
  </div></div>`);
  $("#start").onclick = () => localStorage.getItem(agreedKey) ? video() : terms();
}

/* 2) الشروط */
function terms(){
  const T = [
    "شاهد الفيديو التعليمي قبل ما تبدي بإنشاء الحساب.",
    "اكتب المعلومات مطابقة للكارت حرفياً، والأسهل تستخدم زر النسخ.",
    "اختار دولة الحساب العراق حتى تشتغل كل الخدمات.",
    "اربط رقم هاتفك بالحساب حتى ما تفقده.",
    "فعّل ميزة العثور على iPhone بعد الإنشاء.",
    "احتفظ بالكارت بمكان آمن، ولا تغيّر معلومات الحساب حتى يبقى الكارت يفيدك إذا نسيت.",
    "أنت المسؤول عن أي استخدام مخالف للقانون أو للسياسات.",
  ];
  go(() => `
    <h2 class="h2">قبل ما نبدي.</h2>
    <p class="sub">اقرأ هذني النقاط، تساعدك تحافظ على حسابك.</p>
    <ul class="terms">${T.map((t,i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join("")}</ul>
    <label class="agree"><input type="checkbox" id="ok"> قرأت الشروط وأوافق عليها</label>
    <button class="pill wide" id="go" disabled>متابعة</button>`);
  $("#ok").onchange = e => $("#go").disabled = !e.target.checked;
  $("#go").onclick = () => { localStorage.setItem(agreedKey,"1"); video(); };
}

/* 3) الفيديو */
function video(){
  const yt = CONFIG.videoUrl.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);
  const player = yt
    ? `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`
    : `<video src="${esc(CONFIG.videoUrl)}" controls playsinline preload="metadata"></video>`;
  go(() => `
    <h2 class="h2">شلون تنشئ الحساب.</h2>
    <p class="sub">شوف الفيديو للآخر، بعدها تطلعلك معلومات حسابك.</p>
    <div class="player">${player}</div>
    <button class="pill wide" id="go">شفت الفيديو، اعرض المعلومات</button>`);
  $("#go").onclick = info;
}

/* 4) المعلومات بنفس ترتيب صفحة إنشاء الحساب */
function info(){
  const [y,m,d] = (acc.d||"").split("-");
  const F = [];  // [label, shown value, value to copy, ltr?]
  const fld = (label, shown, copyVal, ltr, sm) => { F.push(copyVal ?? shown);
    return `<button class="fld ${sm?"sm":""}" data-i="${F.length-1}"><span class="t"><small>${label}</small><span class="v ${ltr?"ltr":""}">${esc(shown)}</span></span><span class="cp">${ICON.copy}</span></button>`; };
  go(() => `
    <h2 class="h2">أنشئ حسابك.</h2>
    <p class="sub">اضغط على أي خانة حتى تنسخها، والصقها بنفس الخانة بالآيفون.</p>
    <div class="form">
      <div class="grid2">${fld("الاسم الأول", acc.f, null, true, 1)}${fld("الاسم الأخير", acc.l, null, true, 1)}</div>
      <div class="lbl">تاريخ الميلاد</div>
      <div class="grid3">${fld("اليوم", String(+d), null, true, 1)}${fld(`الشهر · ${MONTHS_EN[+m-1].slice(0,3)} (${+m})`, MONTHS[+m-1], String(+m), false, 1)}${fld("السنة", y, null, true, 1)}</div>
      <div class="sep"></div>
      ${fld("البريد الإلكتروني · Email", acc.e, isIcloud ? acc.e.split("@")[0] : acc.e, true)}
      ${isIcloud ? `<p class="note">زر النسخ ينسخ الجزء اللي قبل @ بس، لأن الآيفون يكمل ‎@icloud.com‎ وحده.</p><div style="height:12px"></div>` : ""}
      ${fld("كلمة المرور · Password", acc.p, null, true)}
      ${acc.ph ? `<div class="sep"></div>${fld("رقم الهاتف · Phone number", acc.ph, null, true)}` : ""}
      <div style="height:14px"></div>
      <button class="pill wide" id="all">نسخ الكل</button>
      <div style="text-align:center;margin-top:6px"><button class="link" id="vid">رجوع للفيديو</button></div>
      <p class="steps-mini">رقم الكارت ${esc(acc.s||"")}</p>
    </div>`);
  app.querySelectorAll(".fld").forEach(b => b.onclick = () => copy(F[b.dataset.i], b));
  const all = `First name: ${acc.f}\nLast name: ${acc.l}\nDate of birth: ${+d} ${MONTHS_EN[+m-1]} ${y}\nEmail: ${acc.e}\nPassword: ${acc.p}` + (acc.ph ? `\nPhone: ${acc.ph}` : "");
  $("#all").onclick = () => copy(all, null, "تم نسخ كل المعلومات");
  $("#vid").onclick = video;
}

async function copy(text, el, msg){
  try{ await navigator.clipboard.writeText(text); }
  catch{ const t=document.createElement("textarea"); t.value=text; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0"; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  if(el){ el.classList.add("done"); el.querySelector(".cp").innerHTML = ICON.check; setTimeout(()=>{ el.classList.remove("done"); el.querySelector(".cp").innerHTML = ICON.copy; }, 1600); }
  const t = $("#toast"); t.textContent = msg || `تم النسخ: ${text.length > 24 ? text.slice(0,24)+"…" : text}`;
  t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1800);
}

if(!acc){
  app.innerHTML = `<div class="err view">${ring()}<h2 class="h2">الرابط غير صحيح.</h2><p class="sub">امسح الباركود الموجود على الكارت مرة ثانية.</p></div>`;
} else if(localStorage.getItem(agreedKey)) info();
else home();
</script>
