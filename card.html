<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>محفظة الحساب</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--ink:#111;--mute:#6b6b70;--line:#e3e3e8;--acc:#0a66ff;--ok:#1a9b4b}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f2;--mute:#9a9aa0;--line:#2c2c2e}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 40px}
  main{max-width:460px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 4px 4px}
  .sub{color:var(--mute);font-size:14px;margin:0 4px 14px}
  .box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
  .steps{display:flex;gap:6px;margin:0 4px 14px}
  .steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .steps i.on{background:var(--acc)}
  ul{padding-inline-start:20px;margin:0}
  li{margin:6px 0}
  button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
  .primary{background:var(--acc);color:#fff;width:100%;font-weight:600}
  .primary:disabled{opacity:.4}
  .ghost{background:transparent;color:var(--acc);width:100%;margin-top:6px}
  label.chk{display:flex;gap:10px;align-items:center;margin:14px 0 12px;font-size:15px}
  label.chk input{width:20px;height:20px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:12px;color:var(--mute)}
  .row .v{font:600 17px/1.3 ui-monospace,Menlo,Consolas,monospace;text-align:right;word-break:break-all}
  .row div{flex:1;min-width:0}
  .copy{background:var(--acc);color:#fff;padding:8px 14px;font-size:14px;flex:none}
  .copy.done{background:var(--ok)}
  video{width:100%;border-radius:12px;background:#000}
  .err{text-align:center;padding:40px 16px;color:var(--mute)}
  .serial{color:var(--mute);font-size:12px;text-align:center;margin-top:6px}
  .wa{display:block;text-align:center;color:var(--ok);font-weight:600;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== إعدادات الصفحة (عدّلها مرة وحدة) ====== */
const CONFIG = {
  shopName: "العالم للحسابات",
  whatsapp: "9647716145089",          // بدون + وبدون مسافات
  videoUrl: "video.mp4",               // رابط فيديو الشرح (ملف بنفس المجلد أو رابط يوتيوب)
};
/* ============================================== */

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function decode(h){
  try{
    let b = h.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const txt = new TextDecoder().decode(Uint8Array.from(atob(b), c=>c.charCodeAt(0)));
    const [v,s,e,p,f,l,d,ph] = txt.split("\u001f");
    if(v!=="1" || !e || !p) return null;
    return {s,e,p,f,l,d,ph};
  }catch{ return null; }
}
function fmtDate(iso){
  const [y,m,d] = (iso||"").split("-");
  const months=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
  return y ? `${+d} ${months[+m-1]} ${y}` : "";
}

const acc = decode(location.hash.slice(1));
const agreedKey = "agreed_"+(acc?.s||"");

function steps(n){ return `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`; }

function terms(){
  app.innerHTML = `${steps(1)}<h1>الشروط والأحكام</h1><p class="sub">اقرأها قبل ما تبدي</p>
  <div class="box"><ul>
    <li>شوف الفيديو التعليمي قبل لا تبدي بإنشاء الحساب.</li>
    <li>هذا الكارت هو محفظة لمعلومات حسابك، احتفظ بيه بمكان آمن.</li>
    <li>إنشاء الحساب يكون من قبلك على جهازك، والمعلومات تكون مطابقة للكارت حرفياً.</li>
    <li>اربط رقم هاتفك بالحساب حتى ما تفقده.</li>
    <li>فعّل ميزة العثور على iPhone بعد الإنشاء.</li>
    <li>لا تغيّر معلومات الحساب، وإذا غيّرتها فالمحل غير مسؤول عن فقدانه.</li>
    <li>المحل غير مسؤول عن أي استخدام غير قانوني للحساب.</li>
  </ul>
  <label class="chk"><input type="checkbox" id="ok"> قرأت الشروط وأوافق عليها</label>
  <button class="primary" id="go" disabled>متابعة</button></div>`;
  $("#ok").onchange = e => $("#go").disabled = !e.target.checked;
  $("#go").onclick = () => { localStorage.setItem(agreedKey,"1"); video(); };
}

function video(){
  const yt = CONFIG.videoUrl.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);
  const player = yt
    ? `<iframe src="https://www.youtube.com/embed/${yt[1]}" style="width:100%;aspect-ratio:9/16;border:0;border-radius:12px" allowfullscreen></iframe>`
    : `<video src="${esc(CONFIG.videoUrl)}" controls playsinline preload="metadata"></video>`;
  app.innerHTML = `${steps(2)}<h1>طريقة إنشاء الحساب</h1><p class="sub">شوف الفيديو للآخر، بعدها تطلعلك معلومات حسابك</p>
  <div class="box">${player}</div>
  <button class="primary" id="go">شفت الفيديو، اعرضلي المعلومات</button>`;
  $("#go").onclick = info;
}

function info(){
  const rows = [
    ["البريد الإلكتروني (Apple ID)", acc.e],
    ["كلمة المرور", acc.p],
    ["الاسم الأول First Name", acc.f],
    ["الاسم الأخير Last Name", acc.l],
    ["تاريخ الميلاد", fmtDate(acc.d)],
    ...(acc.ph ? [["رقم الهاتف", acc.ph]] : []),
  ];
  app.innerHTML = `${steps(3)}<h1>محفظة حساب Apple ID</h1><p class="sub">اضغط «نسخ» والصق بالخانة بالضبط</p>
  <div class="box">${rows.map(([k,v],i)=>`<div class="row"><div><div class="k">${esc(k)}</div><div class="v" dir="auto">${esc(v)}</div></div><button class="copy" data-i="${i}">نسخ</button></div>`).join("")}</div>
  <button class="primary" id="all">نسخ الكل</button>
  <button class="ghost" id="vid">رجوع للفيديو</button>
  ${CONFIG.whatsapp ? `<a class="wa" href="https://wa.me/${esc(CONFIG.whatsapp)}?text=${encodeURIComponent("مساعدة بالحساب رقم "+(acc.s||""))}">تحتاج مساعدة؟ راسلنا واتساب</a>`:""}
  <div class="serial">${esc(CONFIG.shopName)} · رقم الكارت ${esc(acc.s||"")}</div>`;
  const copy = async (text, btn) => {
    try{ await navigator.clipboard.writeText(text); }
    catch{ const t=document.createElement("textarea"); t.value=text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.classList.add("done"); const o=btn.textContent; btn.textContent="تم ✓"; setTimeout(()=>{btn.classList.remove("done");btn.textContent=o},1500);
  };
  app.querySelectorAll(".copy").forEach(b => b.onclick = () => copy(rows[b.dataset.i][1], b));
  $("#all").onclick = e => copy(rows.map(r=>`${r[0]}: ${r[1]}`).join("\n"), e.target);
  $("#vid").onclick = video;
}

if(!acc) app.innerHTML = `<div class="err"><h1>الرابط غير صحيح</h1><p>امسح الباركود الموجود على الكارت مرة ثانية.</p></div>`;
else if(localStorage.getItem(agreedKey)) info();
else terms();
</script>
</body>
</html>
