<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apple ID – بطاقة معلومات (المالك)</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- ExcelJS + FileSaver للإكسل مع الصور -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    :root{
      --overlay: rgba(15,16,20,.55);
      --card-bg: #fff;
      --card-border: #e7e7ea;
      --muted: #6b7280;
      --text: #111827;
      --row-bg: #f7f7fb;
      --row-border: #e9e9f2;
      --primary: #2563eb;
      --primary-600:#1e50bd;
      --ghost:#f3f4f6;
      --shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:#f2f3f6;
      height:100%;
    }
    .backdrop{
      position:relative;
      min-height:100vh;
      background:var(--overlay);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:24px;
      overflow-y:auto;
    }
    .card{
      width:min(720px,96vw);
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin:auto;
    }
    .header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--card-border)}
    .title{font-size:20px;font-weight:700}
    .content{padding:16px 16px 0}
    .footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 16px 16px;border-top:1px solid var(--card-border);background:#fff}
    .section-title{font-weight:600;margin:12px 6px 8px}
    .note{color:var(--muted);font-size:13px;margin:0 6px 12px}
    .row{display:flex;align-items:center;gap:10px;background:var(--row-bg);border:1px solid var(--row-border);border-radius:12px;padding:10px 12px;margin:8px 0}
    .row input{flex:1;background:transparent;border:none;outline:none;font-size:16px;color:var(--text);padding:8px 6px}
    .btn{border:none;cursor:pointer;font-weight:600;border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-600)}
    .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--card-border)}
    .btn-soft{background:var(--ghost);color:var(--text)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:580px){.two{grid-template-columns:1fr}}
    .qrbox{display:grid;place-items:center;padding:16px}
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="card" id="card-root">
      <div class="header">
        <div class="title">صفحة المالك – Apple ID / Gmail</div>
      </div>

      <div class="content">
        <div class="section-title">البريد الإلكتروني</div>
        <div class="row">
          <button class="btn btn-primary copy-btn" data-target="email">نسخ</button>
          <input id="email" type="email">
        </div>

        <div class="section-title">كلمة المرور</div>
        <div class="row">
          <button class="btn btn-primary copy-btn" data-target="password">نسخ</button>
          <input id="password" type="text">
        </div>

        <div class="two">
          <div>
            <div class="section-title">First Name</div>
            <div class="row">
              <button class="btn btn-primary copy-btn" data-target="fname">نسخ</button>
              <input id="fname" type="text">
            </div>
          </div>
          <div>
            <div class="section-title">Last Name</div>
            <div class="row">
              <button class="btn btn-primary copy-btn" data-target="lname">نسخ</button>
              <input id="lname" type="text">
            </div>
          </div>
        </div>

        <div class="section-title">Date of Birth</div>
        <div class="row">
          <button class="btn btn-primary copy-btn" data-target="dob">نسخ</button>
          <input id="dob" type="text">
        </div>

        <div class="section-title">Phone Number</div>
        <div class="row">
          <button class="btn btn-primary copy-btn" data-target="phone">نسخ</button>
          <input id="phone" type="text">
        </div>

        <div class="qrbox"><div id="qrcode"></div></div>
      </div>

      <div class="footer">
        <span id="saveCounter" style="margin-inline-end:auto;font-weight:600;">
  العدد: 0
</span>
        <button class="btn btn-soft" onclick="genEmail()">Generate Email</button>
        <button class="btn btn-soft" onclick="genPassword()">Generate Password</button>
        <button class="btn btn-soft" onclick="genNames()">Generate Names</button>
        <button class="btn btn-soft" onclick="genDOB()">Generate DOB</button>
        <button class="btn btn-primary" onclick="previewQR()">Create QR</button>
        <button class="btn btn-primary" onclick="makeQR_PNG_Fixed()">💾 Save PNG QR</button>
        <button class="btn btn-primary" onclick="chooseQRFolder()">📁 اختيار مجلد QR</button>
<div class="row" style="background:transparent;border:none;">
  <input id="bulkCount" type="number" min="1" placeholder="عدد الحسابات (مثلاً 500)"
    style="padding:10px;border-radius:10px;border:1px solid #ccc;font-size:16px;width:220px;">
  <button class="btn btn-primary" onclick="bulkGenerate()">🚀 إنشاء دفعة</button>
</div>


        <div class="row" style="justify-content:center; gap:8px; background:transparent; border:none; margin-top:4px;">
          <label style="font-weight:600;">النطاق:</label>
          <select id="emailDomain" style="padding:8px 10px; border-radius:8px; border:1px solid #ccc; font-size:15px;">
            <option value="@icloud.com">@icloud.com</option>
            <option value="@gmail.com">@gmail.com</option>
          </select>
        </div>

        <button class="btn btn-ghost" onclick="copyShare()">Share Link</button>
        <button class="btn btn-primary" onclick="saveCardImage()">Save Card</button>
        <button class="btn btn-primary" onclick="openTutorial()">🎓 مشاهدة الفيديو التعليمي</button>

        <!-- أزرار الإكسل الجديدة -->
        <button class="btn btn-ghost" onclick="clearExcel()">🗑 مسح بيانات الإكسل</button>
        <button class="btn btn-primary" onclick="addToExcel()">➕ إضافة للإكسل</button>
        <button class="btn btn-primary" onclick="downloadExcel()">📄 تحميل ملف Excel</button>
      </div>
    </div>
  </div>

<script>

async function bulkGenerate() {
  const count = parseInt($("bulkCount").value);

  if (!count || count < 1) {
    alert("⚠️ أدخل رقم صحيح");
    return;
  }

  if (!qrDirectoryHandle) {
    alert("⚠️ اختر مجلد حفظ QR أولاً");
    return;
  }

  const confirmRun = confirm(`هل أنت متأكد من إنشاء ${count} حساب؟`);
  if (!confirmRun) return;

  // تعطيل الزر أثناء التنفيذ
  document.body.style.pointerEvents = "none";

  for (let i = 0; i < count; i++) {
    genNames();
    genDOB();
    genPassword();
    genEmail();

    // انتظر كل عملية حفظ (مهم جداً)
    await addToExcel();

    // تأخير بسيط لتجنب تجميد المتصفح
    await new Promise(r => setTimeout(r, 25));
  }

  document.body.style.pointerEvents = "auto";
  alert(`✅ تم إنشاء ${count} حساب بنجاح`);
}

  
  let qrDirectoryHandle = null;
let qrFileCounter = 1;

const $=id=>document.getElementById(id);
const baseURL = "https://www.idcardhub.com/"; // ✳️ دومينك الرسمي هنا
let currentDomain="@icloud.com";

let excelWorkbook = new ExcelJS.Workbook();
let excelSheet = excelWorkbook.addWorksheet("Accounts");

// إعداد التوزيع: 10 حسابات في كل صف، وكل حساب 4 أعمدة
const accountsPerRow   = 10;
const colsPerAccount   = 4;
let accountCounter     = 0;
  let savedCount = 0;

function updateSaveCounter(){
  const el = $("saveCounter");
  if (el) el.textContent = "الحسابات المحفوظة: " + savedCount;
}


// إنشاء صف العناوين (Email 1, Password 1, ... , QR 10)
function initExcelHeaders() {
  for (let i = 0; i < accountsPerRow; i++) {
    const colBase = i * colsPerAccount + 1; // 1 = العمود A
    const slot    = i + 1;

    excelSheet.getCell(1, colBase    ).value = `Email ${slot}`;
    excelSheet.getCell(1, colBase + 1).value = `Password ${slot}`;
    excelSheet.getCell(1, colBase + 2).value = `DOB ${slot}`;
    excelSheet.getCell(1, colBase + 3).value = `QR ${slot}`;
  }
}
initExcelHeaders();


document.addEventListener("DOMContentLoaded",()=>{
  $("emailDomain").value=localStorage.getItem("lastDomain")||"@icloud.com";
  currentDomain=$("emailDomain").value;
  $("emailDomain").addEventListener("change",()=>{
    currentDomain=$("emailDomain").value;
    localStorage.setItem("lastDomain",currentDomain);
  });
  document.querySelectorAll(".copy-btn").forEach(btn=>
    btn.addEventListener("click",()=>copyField(btn.dataset.target))
  );
});
  async function chooseQRFolder() {
  try {
    qrDirectoryHandle = await window.showDirectoryPicker();
    alert("✅ تم اختيار مجلد لحفظ صور QR بنجاح!");
  } catch (err) {
    console.error(err);
    alert("❌ لم يتم اختيار المجلد.");
  }
}


function genNames(){
  const FIRST=["James","John","Robert","Michael","Emily","Emma","Olivia","Sophia","Isabella"];
  const LAST=["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis"];
  $("fname").value=FIRST[Math.floor(Math.random()*FIRST.length)];
  $("lname").value=LAST[Math.floor(Math.random()*LAST.length)];
}

function genDOB(){
  const months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const y=1990+Math.floor(Math.random()*(2006-1990+1));
  const m=Math.floor(Math.random()*12);
  const d=1+Math.floor(Math.random()*28);
  $("dob").value=`${String(d).padStart(2,"0")} ${months[m]} ${y}`;
}

function genEmail(len=14){
  const lower="abcdefghijklmnopqrstuvwxyz",nums="0123456789";
  const numCount=3+Math.floor(Math.random()*2);
  const lowerCount=len-numCount;
  const numChars=Array.from({length:numCount},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
  const lowerChars=Array.from({length:lowerCount},()=>lower[Math.floor(Math.random()*lower.length)]).join('');
  const username=(lowerChars+numChars).split('').sort(()=>Math.random()-0.5).join('');
  $("email").value="a"+username+currentDomain;
}

function genPassword(len=10){
  const lower="abcdefghijklmnopqrstuvwxyz",upper="ABCDEFGHIJKLMNOPQRSTUVWXYZ",nums="0123456789",symbols="!@#$%^&*";
  const numCount=2+Math.floor(Math.random()*2);
  const numChars=Array.from({length:numCount},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
  const upperChar=upper[Math.floor(Math.random()*upper.length)];
  const symbolChar=symbols[Math.floor(Math.random()*symbols.length)];
  const remainingCount=len-(numCount+2);
  const lowerChars=Array.from({length:remainingCount},()=>lower[Math.floor(Math.random()*lower.length)]).join('');
  $("password").value=(upperChar+numChars+symbolChar+lowerChars).split('').sort(()=>Math.random()-0.5).join('');
}

function collect(){return{
  email:$("email").value.trim(),
  password:$("password").value.trim(),
  fname:$("fname").value.trim(),
  lname:$("lname").value.trim(),
  dob:$("dob").value.trim(),
  phone:$("phone").value.trim()
};}

function buildLink(){
  const d=collect();
  if(!d.email||!d.password)return null;
  const page=(currentDomain==="@gmail.com")?"view-gmail.html":"view-icloud.html";
  return `${baseURL}${page}?${new URLSearchParams(d)}`;
}

/* === حفظ PNG بقياس ثابت 2.81cm وبقاء المعاينة === */
function makeQR_PNG_Fixed() {
  const link = buildLink();
  if (!link) { alert("⚠️ لا يوجد بيانات كافية"); return; }

  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const desiredCm   = 2.81;
  const effectiveDpi = 96;
  const pxPerCm     = effectiveDpi / 2.54;
  const sizePx      = Math.round(desiredCm * pxPerCm);

  const scaleFactor = 8;
  const big = document.createElement("canvas");
  big.width  = sizePx * scaleFactor;
  big.height = sizePx * scaleFactor;
  const bctx = big.getContext("2d");

  bctx.fillStyle = "#ffffff";
  bctx.fillRect(0, 0, big.width, big.height);
  bctx.fillStyle = "#000000";

  const cellCount = qr.getModuleCount();
  const cellSize  = big.width / cellCount;
  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) {
        bctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  const out = document.createElement("canvas");
  out.width  = sizePx;
  out.height = sizePx;
  const octx = out.getContext("2d");
  octx.drawImage(big, 0, 0, sizePx, sizePx);

  const dataURL = out.toDataURL("image/png");

  const qrBox = $("qrcode");
  const img = new Image();
  img.onload = () => {
    qrBox.innerHTML = "";
    img.style.width  = `${desiredCm}cm`;
    img.style.height = `${desiredCm}cm`;
    img.style.display = "block";
    img.style.margin  = "auto";
    qrBox.appendChild(img);
  };
  img.src = dataURL;

  const a = document.createElement("a");
  a.href = dataURL;
  a.download = "apple-id-qr.png";
  a.click();
}

/* === معاينة فقط بقياس ثابت === */
function previewQR() {
  const link = buildLink();
  if (!link) { alert("⚠️ لا يوجد بيانات كافية"); return; }

  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const desiredCm   = 2.56;
  const wordDpi = 300;
  const pxPerCm     = wordDpi / 2.54;
  const sizePx      = Math.round(desiredCm * pxPerCm);

  const canvas = document.createElement("canvas");
  canvas.width  = sizePx;
  canvas.height = sizePx;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, sizePx, sizePx);
  ctx.fillStyle = "#000000";

  const cellCount = qr.getModuleCount();
  const cellSize  = sizePx / cellCount;
  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  const qrBox = $("qrcode");
  qrBox.innerHTML = "";
  const img = document.createElement("img");
  img.src = canvas.toDataURL("image/png", 1.0);
  img.style.width  = `${desiredCm}cm`;
  img.style.height = `${desiredCm}cm`;
  img.style.display = "block";
  img.style.margin = "auto";
  qrBox.appendChild(img);
}

async function addToExcel() {
  const d = collect();

  if (!d.email || !d.password) {
    alert("⚠️ الرجاء إدخال البريد وكلمة المرور أولاً");
    return;
  }

  const link = buildLink();
  if (!link) {
    alert("⚠️ لا يوجد بيانات كافية لبناء الرابط");
    return;
  }

  // تحقق أنه تم اختيار مجلد الحفظ
  if (!qrDirectoryHandle) {
    alert("⚠️ الرجاء اختيار مجلد لحفظ صور QR أولاً");
    return;
  }

  // ===== 1) توليد صورة الـ QR في Canvas =====
  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const sizePx = 220;
  const canvas = document.createElement("canvas");
  canvas.width  = sizePx;
  canvas.height = sizePx;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, sizePx, sizePx);
  ctx.fillStyle = "#000";

  const cellCount = qr.getModuleCount();
  const cellSize  = sizePx / cellCount;

  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  const dataURL    = canvas.toDataURL("image/png");
  const base64Data = dataURL.split(",")[1];
  const binary     = atob(base64Data);
  const bytes      = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  // ===== 2) حفظ ملف PNG داخل المجلد الذي اخترته =====
  const fileName = `qr_${String(qrFileCounter).padStart(4, "0")}.png`;
  qrFileCounter++;

  const fileHandle = await qrDirectoryHandle.getFileHandle(fileName, { create: true });
  const writable   = await fileHandle.createWritable();
  await writable.write(bytes);
  await writable.close();

  // ===== 3) تحديد مكان هذا الحساب في الإكسل (أفقيًا) =====
  accountCounter++;                         // رقم هذا الحساب
  const idx        = accountCounter - 1;    
  const rowIndex   = Math.floor(idx / accountsPerRow) + 2; // الصف 2 وما بعده للبيانات
  const slotInRow  = idx % accountsPerRow;                
  const startCol   = slotInRow * colsPerAccount + 1;       // بداية أعمدة الحساب

  const saveFolderPath = "C:\\Users\\Saif\\Desktop\\QRs\\";

  // تعبئة الأربع أعمدة لهذا الحساب
  excelSheet.getCell(rowIndex, startCol    ).value = d.email;
  excelSheet.getCell(rowIndex, startCol + 1).value = d.password;
  excelSheet.getCell(rowIndex, startCol + 2).value = d.dob;
  excelSheet.getCell(rowIndex, startCol + 3).value = saveFolderPath + fileName;
  savedCount++;
  updateSaveCounter();

  
}

function clearExcel(){
  const ok = confirm("هل أنت متأكد من مسح جميع البيانات من ملف الإكسل؟\nلن يتم حذف صور الـ QR من المجلد.");
  if (!ok) return;

  // إعادة إنشاء ملف إكسل جديد
  excelWorkbook = new ExcelJS.Workbook();
  excelSheet    = excelWorkbook.addWorksheet("Accounts");

  // إعادة العناوين
  initExcelHeaders();

  // تصفير العدادات
  accountCounter = 0;
  savedCount     = 0;
  updateSaveCounter();

  alert("🗑 تم مسح بيانات الإكسل في الذاكرة. يمكنك البدء من جديد.");
}

/* ============ تحميل ملف Excel النهائي ============ */
async function downloadExcel(){
  if (excelSheet.rowCount <= 1) {
    alert("⚠️ لا توجد بيانات محفوظة بعد.");
    return;
  }

  try{
    const buffer = await excelWorkbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    saveAs(blob, "accounts-with-qr.xlsx");
  }catch(err){
    console.error(err);
    alert("حدث خطأ أثناء إنشاء ملف الإكسل.");
  }
}

async function copyShare(){
  const link=buildLink();
  if(!link)return alert("⚠️ الرجاء إدخال البريد وكلمة المرور أولاً");
  await navigator.clipboard.writeText(link);
  alert("✅ تم نسخ رابط المشاركة:\n"+link);
}

async function copyField(id){
  const v=$(id).value||"";
  if(!v)return alert("الحقل فارغ");
  await navigator.clipboard.writeText(v);
  alert("تم النسخ: "+v);
}

async function saveCardImage(){
  const canvas=await html2canvas($("card-root"),{scale:2});
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png");
  a.download="owner-card.png";
  a.click();
}

function openTutorial(){
  window.open("https://drive.google.com/file/d/1c6aytgMKDLwQHmRkxaSRyvk0Ry9ZSOV9/view?usp=sharing");
}
</script>
</body>
