<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apple ID – بطاقة معلومات (المالك)</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- NEW: ExcelJS + FileSaver (للإكسل مع الصور) -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    :root{
      --overlay: rgba(15,16,20,.55);
      --card-bg: #fff;
      --card-border: #e7e7ea;
      --muted: #6b7280;
      --text: #111827;
      --row-bg: #f7f7fb;
      --row-border: #e9e9f2;
      --primary: #2563eb;
      --primary-600:#1e50bd;
      --ghost:#f3f4f6;
      --shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:#f2f3f6;
      height:100%;
    }
    .backdrop{
      position:relative;
      min-height:100vh;
      background:var(--overlay);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:24px;
      overflow-y:auto;
    }
    .card{
      width:min(720px,96vw);
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin:auto;
    }
    .header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--card-border)}
    .title{font-size:20px;font-weight:700}
    .content{padding:16px 16px 0}
    .footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 16px 16px;border-top:1px solid var(--card-border);background:#fff}
    .section-title{font-weight:600;margin:12px 6px 8px}
    .note{color:var(--muted);font-size:13px;margin:0 6px 12px}
    .row{display:flex;align-items:center;gap:10px;background:var(--row-bg);border:1px solid var(--row-border);border-radius:12px;padding:10px 12px;margin:8px 0}
    .row input{flex:1;background:transparent;border:none;outline:none;font-size:16px;color:var(--text);padding:8px 6px}
    .btn{border:none;cursor:pointer;font-weight:600;border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-600)}
    .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--card-border)}
    .btn-soft{background:var(--ghost);color:var(--text)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:580px){.two{grid-template-columns:1fr}}
    .qrbox{display:grid;place-items:center;padding:16px}
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="card" id="card-root">
      <div class="header">
        <div class="title">صفحة المالك – Apple ID / Gmail</div>
      </div>

      <div class="content">
        <div class="section-title">البريد الإلكتروني</div>
        <div class="row"><button class="btn btn-primary copy-btn" data-target="email">نسخ</button><input id="email" type="email"></div>

        <div class="section-title">كلمة المرور</div>
        <div class="row"><button class="btn btn-primary copy-btn" data-target="password">نسخ</button><input id="password" type="text"></div>

        <div class="two">
          <div><div class="section-title">First Name</div><div class="row"><button class="btn btn-primary copy-btn" data-target="fname">نسخ</button><input id="fname" type="text"></div></div>
          <div><div class="section-title">Last Name</div><div class="row"><button class="btn btn-primary copy-btn" data-target="lname">نسخ</button><input id="lname" type="text"></div></div>
        </div>

        <div class="section-title">Date of Birth</div>
        <div class="row"><button class="btn btn-primary copy-btn" data-target="dob">نسخ</button><input id="dob" type="text"></div>

        <div class="section-title">Phone Number</div>
        <div class="row"><button class="btn btn-primary copy-btn" data-target="phone">نسخ</button><input id="phone" type="text"></div>

        <div class="qrbox"><div id="qrcode"></div></div>
      </div>

      <div class="footer">
        <button class="btn btn-soft" onclick="genEmail()">Generate Email</button>
        <button class="btn btn-soft" onclick="genPassword()">Generate Password</button>
        <button class="btn btn-soft" onclick="genNames()">Generate Names</button>
        <button class="btn btn-soft" onclick="genDOB()">Generate DOB</button>
        <button class="btn btn-primary" onclick="previewQR()">Create QR</button>
        <button class="btn btn-primary" onclick="makeQR_PNG_Fixed()">💾 Save PNG QR</button>


        <div class="row" style="justify-content:center; gap:8px; background:transparent; border:none; margin-top:4px;">
          <label style="font-weight:600;">النطاق:</label>
          <select id="emailDomain" style="padding:8px 10px; border-radius:8px; border:1px solid #ccc; font-size:15px;">
            <option value="@icloud.com">@icloud.com</option>
            <option value="@gmail.com">@gmail.com</option>
          </select>
        </div>

        <button class="btn btn-ghost" onclick="copyShare()">Share Link</button>
        <button class="btn btn-primary" onclick="saveCardImage()">Save Card</button>
        <button class="btn btn-primary" onclick="openTutorial()">🎓 مشاهدة الفيديو التعليمي</button>
        <button type="button" onclick="addToExcel()">إضافة لهذه البطاقة</button>
        <button type="button" onclick="downloadExcel()">تحميل ملف Excel</button>
      </div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const baseURL = "https://www.idcardhub.com/"; // ✳️ دومينك الرسمي هنا
let currentDomain="@icloud.com";
let excelRows = JSON.parse(localStorage.getItem("excelRows") || "[]");

document.addEventListener("DOMContentLoaded",()=>{
  $("emailDomain").value=localStorage.getItem("lastDomain")||"@icloud.com";
  currentDomain=$("emailDomain").value;
  $("emailDomain").addEventListener("change",()=>{currentDomain=$("emailDomain").value;localStorage.setItem("lastDomain",currentDomain);});
  document.querySelectorAll(".copy-btn").forEach(btn=>btn.addEventListener("click",()=>copyField(btn.dataset.target)));
});

function genNames(){
  const FIRST=["James","John","Robert","Michael","Emily","Emma","Olivia","Sophia","Isabella"];
  const LAST=["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis"];
  $("fname").value=FIRST[Math.floor(Math.random()*FIRST.length)];
  $("lname").value=LAST[Math.floor(Math.random()*LAST.length)];
}

function genDOB(){
  const months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const y=1990+Math.floor(Math.random()*(2006-1990+1));
  const m=Math.floor(Math.random()*12);
  const d=1+Math.floor(Math.random()*28);
  $("dob").value=`${String(d).padStart(2,"0")} ${months[m]} ${y}`;
}

function genEmail(len=14){
  const lower="abcdefghijklmnopqrstuvwxyz",nums="0123456789";
  const numCount=3+Math.floor(Math.random()*2);
  const lowerCount=len-numCount;
  const numChars=Array.from({length:numCount},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
  const lowerChars=Array.from({length:lowerCount},()=>lower[Math.floor(Math.random()*lower.length)]).join('');
  const username=(lowerChars+numChars).split('').sort(()=>Math.random()-0.5).join('');
  $("email").value="a"+username+currentDomain;
}

function genPassword(len=10){
  const lower="abcdefghijklmnopqrstuvwxyz",upper="ABCDEFGHIJKLMNOPQRSTUVWXYZ",nums="0123456789",symbols="!@#$%^&*";
  const numCount=2+Math.floor(Math.random()*2);
  const numChars=Array.from({length:numCount},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
  const upperChar=upper[Math.floor(Math.random()*upper.length)];
  const symbolChar=symbols[Math.floor(Math.random()*symbols.length)];
  const remainingCount=len-(numCount+2);
  const lowerChars=Array.from({length:remainingCount},()=>lower[Math.floor(Math.random()*lower.length)]).join('');
  $("password").value=(upperChar+numChars+symbolChar+lowerChars).split('').sort(()=>Math.random()-0.5).join('');
}

function collect(){return{
  email:$("email").value.trim(),
  password:$("password").value.trim(),
  fname:$("fname").value.trim(),
  lname:$("lname").value.trim(),
  dob:$("dob").value.trim(),
  phone:$("phone").value.trim()
};}

function buildLink(){
  const d=collect();
  if(!d.email||!d.password)return null;
  const page=(currentDomain==="@gmail.com")?"view-gmail.html":"view-icloud.html";
  return `${baseURL}${page}?${new URLSearchParams(d)}`;
}

/* === حفظ PNG بقياس ثابت 2.55cm وبقاء المعاينة === */
function makeQR_PNG_Fixed() {
  const link = buildLink();
  if (!link) { alert("⚠️ لا يوجد بيانات كافية"); return; }

  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const desiredCm   = 2.81;   // ← التعديل هنا
  const effectiveDpi = 96;
  const pxPerCm     = effectiveDpi / 2.54;
  const sizePx      = Math.round(desiredCm * pxPerCm);

  const scaleFactor = 8;
  const big = document.createElement("as");
  big.width  = sizePx * scaleFactor;
  big.height = sizePx * scaleFactor;
  const bctx = big.getContext("2d");

  bctx.fillStyle = "#ffffff";
  bctx.fillRect(0, 0, big.width, big.height);
  bctx.fillStyle = "#000000";

  const cellCount = qr.getModuleCount();
  const cellSize  = big.width / cellCount;
  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) {
        bctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  const out = document.createElement("as");
  out.width  = sizePx;
  out.height = sizePx;
  const octx = out.getContext("2d");
  octx.drawImage(big, 0, 0, sizePx, sizePx);

  const dataURL = out.toDataURL("image/png");

  const qrBox = $("qrcode");
  const img = new Image();
  img.onload = () => {
    qrBox.innerHTML = "";
    img.style.width  = `${desiredCm}cm`;
    img.style.height = `${desiredCm}cm`;
    img.style.display = "block";
    img.style.margin  = "auto";
    qrBox.appendChild(img);
  };
  img.src = dataURL;

  const a = document.createElement("a");
  a.href = dataURL;
  a.download = "apple-id-qr.png";
  a.click();
}

/* === معاينة فقط بقياس 2.55 سم === */
function previewQR() {
  const link = buildLink();
  if (!link) { alert("⚠️ لا يوجد بيانات كافية"); return; }

  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const desiredCm   = 2.51;   // ← التعديل هنا أيضاً
  const effectiveDpi = 96;
  const pxPerCm     = effectiveDpi / 2.54;
  const sizePx      = Math.round(desiredCm * pxPerCm);

  const canvas = document.createElement("canvas");
  canvas.width  = sizePx;
  canvas.height = sizePx;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, sizePx, sizePx);
  ctx.fillStyle = "#000000";

  const cellCount = qr.getModuleCount();
  const cellSize  = sizePx / cellCount;
  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  const qrBox = $("qrcode");
  qrBox.innerHTML = "";
  const img = new Image();
  img.src = canvas.toDataURL("image/png");
  img.style.width  = `${desiredCm}cm`;
  img.style.height = `${desiredCm}cm`;
  img.style.display = "block";
  img.style.margin  = "auto";
  qrBox.appendChild(img);
}
/* ============ حفظ Excel مع عدة حسابات + QR لكل حساب ============ */
async function saveExcel(){
  const d = collect();

  if (!d.email || !d.password) {
    alert("⚠️ الرجاء إدخال البريد وكلمة المرور أولاً");
    return;
  }

  // بناء الرابط حسب النطاق
  const link = buildLink();
  if (!link) {
    alert("⚠️ لا يوجد بيانات كافية لبناء الرابط");
    return;
  }

  // إضافة الحساب الحالي إلى المصفوفة المحفوظة
  excelRows.push({
    email: d.email,
    password: d.password,
    dob: d.dob,
    phone: d.phone,
    link: link
  });
  localStorage.setItem("excelRows", JSON.stringify(excelRows));

  // إنشاء ملف إكسل جديد يحتوي كل الحسابات
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Accounts");

  ws.columns = [
    { header: "Email",    key: "email",   width: 30 },
    { header: "Password", key: "password",width: 22 },
    { header: "DOB",      key: "dob",     width: 18 },
    { header: "Phone",    key: "phone",   width: 16 },
    { header: "Link",     key: "link",    width: 40 }
  ];

  ws.getRow(1).font = { bold: true };

  for (let i = 0; i < excelRows.length; i++) {
    const rowData  = excelRows[i];
    const rowIndex = i + 2; // الصف الثاني فما فوق

    // إضافة بيانات النص
    ws.addRow({
      email: rowData.email,
      password: rowData.password,
      dob: rowData.dob,
      phone: rowData.phone,
      link: rowData.link
    });

    // توليد QR لهذا الحساب
    const qr = qrcode(0, 'H');
    qr.addData(rowData.link);
    qr.make();

    const sizePx = 220;
    const canvas = document.createElement("canvas");
    canvas.width  = sizePx;
    canvas.height = sizePx;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, sizePx, sizePx);
    ctx.fillStyle = "#000000";

    const cellCount = qr.getModuleCount();
    const cellSize  = sizePx / cellCount;
    for (let r = 0; r < cellCount; r++) {
      for (let c = 0; c < cellCount; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }
    }

    const dataURL   = canvas.toDataURL("image/png");
    const base64Img = dataURL.split(",")[1];

    const imageId = wb.addImage({
      base64: base64Img,
      extension: 'png'
    });

    // وضع صورة الـ QR في عمود F تقريباً مقابل الصف
    ws.addImage(imageId, {
      tl:  { col: 5, row: rowIndex - 1 }, // موضع أعلى يسار الصورة
      ext: { width: 90, height: 90 }
    });

    ws.getRow(rowIndex).height = 70;
  }

  const buffer = await wb.xlsx.writeBuffer();
  saveAs(
    new Blob([buffer], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }),
    "accounts-with-qr.xlsx"
  );

  alert("✅ تم حفظ الملف مع جميع الحسابات (" + excelRows.length + ")");
}


async function copyShare(){
  const link=buildLink();
  if(!link)return alert("⚠️ الرجاء إدخال البريد وكلمة المرور أولاً");
  await navigator.clipboard.writeText(link);
  alert("✅ تم نسخ رابط المشاركة:\n"+link);
}

async function copyField(id){
  const v=$(id).value||"";
  if(!v)return alert("الحقل فارغ");
  await navigator.clipboard.writeText(v);
  alert("تم النسخ: "+v);
}

async function saveCardImage(){
  const canvas=await html2canvas($("card-root"),{scale:2});
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png");
  a.download="owner-card.png";
  a.click();
}

function openTutorial(){window.open("https://drive.google.com/file/d/1c6aytgMKDLwQHmRkxaSRyvk0Ry9ZSOV9/view?usp=sharing");}
  /* === عرض QR فقط بدون حفظ === */
function previewQR() {
  const link = buildLink();
  if (!link) return alert("⚠️ لا يوجد بيانات كافية");

  const qr = qrcode(0, 'H');
  qr.addData(link);
  qr.make();

  const qrSizeCm = 2.56;
  const wordDpi = 300;
  const pxPerCm = wordDpi / 2.54;
  const sizePx = Math.round(qrSizeCm * pxPerCm);

  const canvas = document.createElement("canvas");
  canvas.width = sizePx;
  canvas.height = sizePx;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, sizePx, sizePx);
  ctx.fillStyle = "#000";

  const cellCount = qr.getModuleCount();
  const cellSize = sizePx / cellCount;
  for (let r = 0; r < cellCount; r++) {
    for (let c = 0; c < cellCount; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
    }
  }

  const qrBox = $("qrcode");
  qrBox.innerHTML = "";
  const img = document.createElement("img");
  img.src = canvas.toDataURL("image/png", 1.0);
  img.style.width = `${qrSizeCm}cm`;
  img.style.height = `${qrSizeCm}cm`;
  img.style.display = "block";
  img.style.margin = "auto";
  qrBox.appendChild(img);
}
<canvas id="qrcode-canvas"></canvas>
<script>
  // إنشاء ملف Excel واحد
  let excelWorkbook = new ExcelJS.Workbook();
  let excelSheet = excelWorkbook.addWorksheet("Cards");

  // العناوين
  excelSheet.columns = [
    { header: "Email", key: "email", width: 35 },
    { header: "Password", key: "password", width: 20 },
    { header: "DOB", key: "dob", width: 15 },
    { header: "QR", key: "qr", width: 15 }
  ];

  // لتحديد ارتفاع الصفوف (مهم للصور)
  excelSheet.properties.defaultRowHeight = 120;

  // ---------------------------
  // دالة إضافة البيانات + QR
  // ---------------------------
  async function addToExcel() {
    const email = document.getElementById("email")?.value || "";
    const password = document.getElementById("password")?.value || "";
    const birthDate = document.getElementById("birthDate")?.value || "";

    // الحصول على QR كسورة base64 من الـ canvas
    const qrCanvas = document.getElementById("qrcode-canvas");
    const qrBase64 = qrCanvas.toDataURL("image/png");

    // إضافة الصف
    const row = excelSheet.addRow([email, password, birthDate, ""]);

    const rowNumber = row.number - 1; // لأن الصور تبدأ من 0

    // إضافة الصورة
    const imageId = excelWorkbook.addImage({
      base64: qrBase64,
      extension: 'png',
    });

    // موقع الصورة داخل عمود QR (العمود الرابع)
    excelSheet.addImage(imageId, {
      tl: { col: 3, row: rowNumber },
      ext: { width: 110, height: 110 }
    });

    alert("تمت إضافة الصف مع صورة QR داخل ملف Excel بنجاح ✅");
  }

  // ---------------------------
  // تحميل ملف الإكسل
  // ---------------------------
  async function downloadExcel() {
    const buffer = await excelWorkbook.xlsx.writeBuffer();
    saveAs(new Blob([buffer]), "OwnerCards.xlsx");
  }
</script>

</script>
</body>
